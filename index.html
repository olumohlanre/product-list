<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Choose from a tempting selection of freshly made desserts.">
	<title>Sweet Crumbs | Desserts</title>
	<link rel="stylesheet" href="./style.css">
</head>
<body>
	<main class="page-shell">
		<section class="catalog" aria-labelledby="page-title">
			<div class="catalog-heading">
				<h1 id="page-title">Desserts</h1>
			</div>
			<div id="product-grid" class="product-grid" aria-live="polite"></div>
		</section>

		<aside class="cart-panel" aria-labelledby="cart-title">
			<div class="cart-header">
				<h2 id="cart-title">Your Cart <span id="cart-count">(0)</span></h2>
			</div>
			<div id="cart-content"></div>
		</aside>
	</main>

	<div id="confirmation-modal" class="modal-backdrop" hidden>
		<section class="confirmation-modal" role="dialog" aria-modal="true" aria-labelledby="confirmation-title" aria-describedby="confirmation-copy">
			<img src="./assets/images/icon-order-confirmed.svg" alt="" class="confirmation-icon">
			<h2 id="confirmation-title">Your order is confirmed</h2>
			<p id="confirmation-copy" class="confirmation-copy">We hope you enjoy your food!</p>
			<div id="confirmation-items" class="confirmation-items"></div>
			<button id="start-new-order" class="new-order-button" type="button">Start new order</button>
		</section>
	</div>

	<script src="./app.js"></script>
</body>
</html>
